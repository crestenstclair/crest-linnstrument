[workspace]
resolver = "2"
members = ["crates/crest-performance-core", "crates/crest-linnstrument", "crates/crest-performance-host", "crates/crest-performance-testkit", "crates/linnstrument-sim"]

[workspace.package]
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/crestenstclair/crest-linnstrument"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
crest-performance-core = { path = "crates/crest-performance-core", version = "0.2.0-dev" }
crest-linnstrument = { path = "crates/crest-linnstrument", version = "0.2.0-dev" }
crest-performance-testkit = { path = "crates/crest-performance-testkit", version = "0.2.0-dev" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
