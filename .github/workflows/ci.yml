name: standalone
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/test-web-controls.mjs
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build -p crest-performance-core -p crest-linnstrument --release --locked
      - run: cargo run -p crest-performance-host --locked -- demo
      - run: cargo run -p crest-performance-host --example processing_bench --release --locked > target/processing-bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: processing-benchmark-linux
          path: target/processing-bench.json
  firmware:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.96.0
      - run: scripts/build-native.sh
      - run: python3 scripts/test-firmware.py
      - run: cargo test -p linnstrument-sim --locked --lib -- --include-ignored
      - if: runner.os == 'macOS'
        run: cargo test -p crest-performance-host --features midi --locked --lib -- --include-ignored
      - if: runner.os == 'macOS'
        run: cargo test -p linnstrument-sim --features midi --locked --lib -- --include-ignored
      - run: scripts/build-native.sh --sanitize
      - run: python3 scripts/test-firmware.py
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-traces-${{ matrix.os }}
          path: target/firmware-native/acceptance-*.json
  arm-baseline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: sudo apt-get update && sudo apt-get install -y libc6-i386
      - run: python3 scripts/build-arm.py
      - run: python3 scripts/generate-sketch.py --extract && git diff --exit-code -- firmware/native/prototypes.inc
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-arm-firmware
          path: |
            target/firmware-arm/*.elf
            target/firmware-arm/*.bin
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libasound2-dev webkit2gtk-driver xvfb
      - run: scripts/build-native.sh
      - run: cargo build -p linnstrument-sim --features desktop --locked
      - run: cargo test -p crest-performance-host --features midi --locked
      - run: cargo clippy -p linnstrument-sim --features desktop --all-targets --locked -- -D warnings
      - run: dbus-run-session -- xvfb-run -a python3 scripts/test-desktop.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-acceptance-linux
          path: target/desktop-acceptance/
